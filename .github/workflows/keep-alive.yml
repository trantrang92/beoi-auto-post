name: Keep Server Alive

on:
  schedule:
    - cron: '*/14 * * * *'  # Mỗi 14 phút

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server
        run: curl -s -o /dev/null -w "%{http_code}" https://beoi-api.onrender.com/api/auth/login -X POST -H "Content-Type: application/json" -d '{}' || true
